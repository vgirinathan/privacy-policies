<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GiBri Apps — Privacy Policies</title>
<style>
  :root {
    --bg: #f7faf8;
    --text: #14231a;
    --text-muted: #5b6d61;
    --accent: #2e7d32;
    --rule: #d7e4da;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10160f;
      --text: #e9f1ea;
      --text-muted: #98a99c;
      --accent: #6fcf73;
      --rule: #2a362a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 72px 24px;
  }
  h1 {
    font-size: 26px;
    margin: 0 0 8px;
  }
  p.dek {
    color: var(--text-muted);
    margin: 0 0 32px;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border-top: 1px solid var(--rule);
  }
  li {
    border-bottom: 1px solid var(--rule);
  }
  li a {
    display: block;
    padding: 16px 4px;
    color: var(--text);
    text-decoration: none;
    font-size: 16px;
  }
  li a:hover {
    color: var(--accent);
  }
  li a span.hint {
    display: block;
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Privacy Policies</h1>
    <p class="dek">Privacy policy pages for GiBri Apps' Android apps.</p>
    <ul>
      <li>
        <a href="liteexcel/">
          LiteExcel — Excel Reader
          <span class="hint">com.gibriapps.liteexcel</span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
